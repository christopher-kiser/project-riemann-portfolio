name: Verify public evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Replay exact checks and validate the public records
        run: |
          sha256sum --check --status SHA256SUMS
          python3 -I -B scripts/verify_portfolio.py
